[project]
name = "agile_projects"
authors = [
    { name = "Honey Bird", email = "admin@honey-bird.net" }
]
description = "Agile project management on ERPNext — standalone Kanban SPA with complexity points, dependency blocking and ERP module readiness tracking"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
